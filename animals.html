<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animales 🐾</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0fff0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  .back { position: absolute; top: 20px; left: 20px; font-size: 2em; text-decoration: none; }
  h1 { font-size: 2.5em; margin: 20px 0; }
  #animal { font-size: 8em; margin: 10px 0; min-height: 130px; }
  #name { font-size: 2.5em; font-weight: bold; color: #CC0000; margin: 5px 0; }
  #name-en { font-size: 1.5em; color: #888; margin-bottom: 10px; }
  #sound { font-size: 1.8em; color: #555; margin: 10px 0; min-height: 40px; }
  #sound.muted { color: #999; font-size: 1.2em; }
  .nav { display: flex; gap: 30px; margin-top: 20px; }
  .nav-btn {
    font-size: 3em; padding: 15px 35px; border-radius: 20px; border: none;
    background: white; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: transform 0.2s;
  }
  .nav-btn:active { transform: scale(0.9); }
  #counter { font-size: 1.3em; color: #888; margin-top: 15px; }
</style>
</head>
<body>
<a href="index.html" class="back">🏠</a>
<h1>🐾 Animales</h1>
<div id="animal"></div>
<div id="name"></div>
<div id="name-en"></div>
<div id="sound"></div>
<div class="nav">
  <button class="nav-btn" onclick="prev()">⬅️</button>
  <button class="nav-btn" onclick="playSound()">🔊</button>
  <button class="nav-btn" onclick="next()">➡️</button>
</div>
<div id="counter"></div>

<script>
const animals = [
  { emoji: '🐶', es: 'PERRO', en: 'Dog', label: 'Ladrido real', audio: 'assets/animal-sounds/dog.ogg' },
  { emoji: '🐱', es: 'GATO', en: 'Cat', label: 'Maullido real', audio: 'assets/animal-sounds/cat.ogg' },
  { emoji: '🐄', es: 'VACA', en: 'Cow', label: 'Mugido real', audio: 'assets/animal-sounds/cow.ogg' },
  { emoji: '🐷', es: 'CERDO', en: 'Pig', label: 'Oink real', audio: 'assets/animal-sounds/pig.ogg' },
  { emoji: '🐔', es: 'GALLINA', en: 'Chicken', label: 'Gallina real', audio: 'assets/animal-sounds/chicken.ogg' },
  { emoji: '🐴', es: 'CABALLO', en: 'Horse', label: 'Relincho real', audio: 'assets/animal-sounds/horse.ogg' },
  { emoji: '🐸', es: 'RANA', en: 'Frog', label: 'Rana real', audio: 'assets/animal-sounds/frog.ogg' },
  { emoji: '🦁', es: 'LEÓN', en: 'Lion', label: 'Rugido real', audio: 'assets/animal-sounds/lion.ogg' },
  { emoji: '🐘', es: 'ELEFANTE', en: 'Elephant', label: 'Trompeta real', audio: 'assets/animal-sounds/elephant.ogg' },
  { emoji: '🐦', es: 'PÁJARO', en: 'Bird', label: 'Pájaro real', audio: 'assets/animal-sounds/bird.ogg' },
  { emoji: '🐒', es: 'MONO', en: 'Monkey', label: 'Mono real', audio: 'assets/animal-sounds/monkey.ogg' },
  { emoji: '🐟', es: 'PEZ', en: 'Fish', label: 'Los peces casi no hacen sonidos audibles', audio: null },
  { emoji: '🦆', es: 'PATO', en: 'Duck', label: 'Audio pendiente', audio: null },
  { emoji: '🐝', es: 'ABEJA', en: 'Bee', label: 'Audio pendiente', audio: null },
  { emoji: '🐍', es: 'SERPIENTE', en: 'Snake', label: 'Audio pendiente', audio: null }
];
let idx = 0;
let activeAudio = null;
let stopTimer = null;

function show() {
  const a = animals[idx];
  document.getElementById('animal').textContent = a.emoji;
  document.getElementById('name').textContent = a.es;
  document.getElementById('name-en').textContent = a.en;
  document.getElementById('sound').textContent = '';
  document.getElementById('sound').className = '';
  document.getElementById('counter').textContent = (idx+1) + ' / ' + animals.length;
}

function stopActiveAudio() {
  if (stopTimer) {
    clearTimeout(stopTimer);
    stopTimer = null;
  }

  if (activeAudio) {
    activeAudio.pause();
    activeAudio.currentTime = 0;
    activeAudio = null;
  }
}

function playSound() {
  const soundBox = document.getElementById('sound');
  const animal = animals[idx];

  stopActiveAudio();

  if (!animal.audio) {
    soundBox.textContent = animal.label;
    soundBox.className = 'muted';
    return;
  }

  soundBox.textContent = '🔊 ' + animal.label;
  soundBox.className = '';

  activeAudio = new Audio(animal.audio);
  activeAudio.play().catch(() => {
    soundBox.textContent = 'No se pudo reproducir este sonido.';
    soundBox.className = 'muted';
    activeAudio = null;
  });

  stopTimer = setTimeout(() => {
    stopActiveAudio();
  }, 2500);
}

function next() { stopActiveAudio(); idx = (idx + 1) % animals.length; show(); }
function prev() { stopActiveAudio(); idx = (idx - 1 + animals.length) % animals.length; show(); }
show();
</script>
</body>
</html>
